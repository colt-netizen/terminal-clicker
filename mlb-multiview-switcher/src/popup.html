<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MLB Multiview Audio Switcher</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body style="width: 260px">
    <div class="status" id="status">reading tab…</div>

    <div class="row">
      <label for="enabled">Enabled</label>
      <input type="checkbox" id="enabled" />
    </div>

    <div class="row">
      <button id="switchNow" type="button">Switch now</button>
      <button id="openOptions" type="button">Settings</button>
    </div>

    <p class="note">
      “Switch now” rotates to the next pane immediately — the quickest way to confirm promotion
      works on your layout without waiting for dead air.
    </p>

    <script src="shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
