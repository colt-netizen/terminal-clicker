<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MLB Multiview Audio Switcher</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body style="width: 300px">
    <div class="status" id="status">reading tab…</div>

    <h1>Priority</h1>
    <p class="hint" style="margin: -6px 0 8px">
      Top of the list wins. When your favourite goes to a commercial break the audio drops to the
      next one down, then comes back up when the break ends.
    </p>
    <ul class="panes" id="panes"></ul>

    <div class="row">
      <label for="enabled">Enabled</label>
      <input type="checkbox" id="enabled" />
    </div>

    <div class="row">
      <label for="listenMode">
        Listen for dead air
        <span class="hint">Analyses tab audio to catch quiet stretches with no break banner.</span>
      </label>
      <input type="checkbox" id="listenMode" />
    </div>

    <div class="row">
      <button id="switchNow" type="button">Switch now</button>
      <button id="openOptions" type="button">Settings</button>
    </div>

    <script src="shared/settings.js"></script>
    <script src="shared/pane-selector.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
